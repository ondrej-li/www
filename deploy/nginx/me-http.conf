# me.ondralinek.cz — HTTP only, used until the TLS certificate exists.
# deploy/enable-tls.sh swaps this for me.conf once DNS points at the server.
# Source of truth: https://github.com/ondrej-li/www/tree/master/deploy

server {
    listen 80;
    listen [::]:80;
    server_name me.ondralinek.cz;

    root /var/www/me;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/me.access.log;
    error_log  /var/log/nginx/me.error.log;

    # Plain HTTP headers only: HSTS and upgrade-insecure-requests belong to the
    # TLS vhost and would break the site while it is still served over HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        expires -1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(css|js|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
