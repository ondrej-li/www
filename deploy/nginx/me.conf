# me.ondralinek.cz — static personal site.
# Installed as /etc/nginx/sites-available/me by deploy/deploy.sh.
# Source of truth: https://github.com/ondrej-li/www/tree/master/deploy

server {
    listen 80;
    listen [::]:80;
    server_name me.ondralinek.cz www.ondralinek.cz;

    # Let's Encrypt renews through this path, so it must never be redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/me;
        default_type "text/plain";
    }

    location / {
        return 301 https://me.ondralinek.cz$request_uri;
    }
}

# The old address. Everything that still links to www lands on the new host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ondralinek.cz;

    ssl_certificate     /etc/letsencrypt/live/me.ondralinek.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/me.ondralinek.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/me.access.log;
    error_log  /var/log/nginx/me.error.log;

    return 301 https://me.ondralinek.cz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name me.ondralinek.cz;

    root /var/www/me;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/me.ondralinek.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/me.ondralinek.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/me.access.log;
    error_log  /var/log/nginx/me.error.log;

    include /etc/nginx/snippets/me-headers.conf;

    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # The page is never cached, so an edit is visible immediately; assets are
    # cached for a week.
    location = /index.html {
        expires -1;  # -> Cache-Control: no-cache
        include /etc/nginx/snippets/me-headers.conf;
    }

    location ~* \.(css|js|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 7d;
        include /etc/nginx/snippets/me-headers.conf;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
