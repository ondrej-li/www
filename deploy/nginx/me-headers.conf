# Security headers for me.ondralinek.cz.
#
# add_header does not accumulate across levels: a location that sets any header
# drops the ones inherited from the server block, so include this file in every
# location that adds headers of its own.
add_header Strict-Transport-Security    "max-age=31536000" always;
add_header X-Content-Type-Options       "nosniff" always;
add_header X-Frame-Options              "DENY" always;
add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
add_header Permissions-Policy           "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# The page is a single server-rendered HTML file with inline scripts (the
# jQuery fallback and the theme switcher), loads Roboto from Google Fonts,
# jQuery from Google's CDN and posts the contact form to Formspree.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://ajax.googleapis.com; form-action https://formspree.io; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
